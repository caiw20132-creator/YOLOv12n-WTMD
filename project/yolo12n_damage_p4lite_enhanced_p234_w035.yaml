
nc: 1  # 单类：Damage

# 模型缩放因子
depth_multiple: 0.33
width_multiple: 0.35
max_channels: 1024

# ================================================================================
# Backbone: P4-lite（去掉 P5，减少小目标信息丢失）
# ================================================================================
backbone:
  # [from, repeats, module, args]
  # 输入: 960x960x3 (以 imgsz=960 为例)

  - [-1, 1, Conv, [64, 3, 2]]         # 0: stem, stride=2, 480x480
  - [-1, 1, Conv, [128, 3, 2]]        # 1: stride=4, 240x240
  - [-1, 3, C2f, [128]]               # 2: P2 特征 (stride=4), 240x240

  - [-1, 1, Conv, [256, 3, 2]]        # 3: stride=8, 120x120
  - [-1, 6, C2f, [256]]               # 4: P3 特征 (stride=8), 120x120

  - [-1, 1, Conv, [512, 3, 2]]        # 5: stride=16, 60x60
  - [-1, 6, C2f, [512]]               # 6: P4 特征 (stride=16), 60x60

  # SF1SPPF 放在 P4 末端
  - [-1, 1, SF1SPPF, [184, 5]]        # 7: P4 + SF1SPPF 增强

# ================================================================================
# Head: FPN+PAN + 三尺度检测（P2+P3+P4）
# ================================================================================
head:
  # Top-down FPN: P4 -> P3 -> P2
  - [-1, 1, Conv, [256, 1, 1]]                        # 8: P4_lateral (60x60) 也作为 P4_out 候选
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 9: 120x120
  - [[-1, 4], 1, Concat, [1]]                        # 10: concat P3
  - [-1, 3, C2f, [256]]                              # 11: P3_fuse

  - [-1, 1, Conv, [128, 1, 1]]                       # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 13: 240x240
  - [[-1, 2], 1, Concat, [1]]                        # 14: concat P2
  - [-1, 3, C2f, [128]]                              # 15: P2_out（stride=4）

  # Bottom-up PAN: P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]                       # 16: downsample -> 120x120
  - [[-1, 11], 1, Concat, [1]]                       # 17: concat P3_fuse
  - [-1, 3, C2f, [256]]                              # 18: P3_out（stride=8）

  # Detect: P2 + P3 + P4（三尺度，stride=4/8/16）
  # - P2_out: idx=15 (240x240)
  # - P3_out: idx=18 (120x120)
  # - P4_out: idx=8  (60x60)  ← 直接复用 P4_lateral，最稳不改结构
  - [[15, 18, 8], 1, Detect, [nc]]                   # 19: 三尺度检测头

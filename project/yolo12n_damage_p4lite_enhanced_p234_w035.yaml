# ================================================================================
# YOLO-WTB-Enhanced: 改进的风电叶片损伤检测模型
# ================================================================================
#
# 基于论文 YOLO-WTB (IEEE Access 2025) + 数据集质量分析的综合改进
#
# 【数据集分析结论】
# - 小目标(<32px)占比: 54.13%~55.63%（各split一致）
# - 框宽度中位数: ~17px, 框高度中位数: ~26px
# - 空标签图片: 299张（需复核是否漏标）
# - 无标注格式问题，数据质量较好
#
# 【论文核心改进（针对你的小目标数据做适配）】
# 1) Backbone 去掉 P5(stride=32)，只保留到 P4(stride=16)，避免小目标在深层特征图“消失”
# 2) P4 处用 SF1-SPPF 替代 SPPF（SoftPool 减少信息丢失）
# 3) 保留 P2/P3 作为小目标主力检测层，同时补入 P4 作为中小目标与稳定回归的辅助层
#
# 【本文件的进一步创新】
# 创新点A: P4-lite Backbone
#   - Backbone 截止到 P4(stride=16)，完全去掉 P5(stride=32)
# 创新点B: 双分支特征增强
#   - P4 处用 SF1SPPF 增强语义
#   - P2/P3 保留空间细节
# 创新点C: 轻量化设计
#   - width_multiple=0.25 适配 RTX3060 12GB
#
# ================================================================================

nc: 1  # 单类：Damage

# 模型缩放因子
depth_multiple: 0.33
width_multiple: 0.35
max_channels: 1024

# ================================================================================
# Backbone: P4-lite（去掉 P5，减少小目标信息丢失）
# ================================================================================
backbone:
  # [from, repeats, module, args]
  # 输入: 640x640x3 (以 imgsz=640 为例)

  - [-1, 1, Conv, [64, 3, 2]]         # 0: stem, stride=2, 320x320
  - [-1, 1, Conv, [128, 3, 2]]        # 1: stride=4, 160x160
  - [-1, 3, C2f, [128]]               # 2: P2 特征 (stride=4), 160x160

  - [-1, 1, Conv, [256, 3, 2]]        # 3: stride=8, 80x80
  - [-1, 6, C2f, [256]]               # 4: P3 特征 (stride=8), 80x80

  - [-1, 1, Conv, [512, 3, 2]]        # 5: stride=16, 40x40
  - [-1, 6, C2f, [512]]               # 6: P4 特征 (stride=16), 40x40

  # SF1SPPF 放在 P4 末端
  # c2 必须匹配实际通道数: 512 * width_multiple = 128
  - [-1, 1, SF1SPPF, [184, 5]]        # 7: P4 + SF1SPPF 增强

# ================================================================================
# Head: FPN+PAN + 三尺度检测（P2+P3+P4）
# ================================================================================
head:
  # Top-down FPN: P4 -> P3 -> P2
  - [-1, 1, Conv, [256, 1, 1]]                        # 8: P4_lateral (40x40) 也作为 P4_out 候选
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 9: 80x80
  - [[-1, 4], 1, Concat, [1]]                        # 10: concat P3
  - [-1, 3, C2f, [256]]                              # 11: P3_fuse

  - [-1, 1, Conv, [128, 1, 1]]                       # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 13: 160x160
  - [[-1, 2], 1, Concat, [1]]                        # 14: concat P2
  - [-1, 3, C2f, [128]]                              # 15: P2_out（stride=4）

  # Bottom-up PAN: P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]                       # 16: downsample -> 80x80
  - [[-1, 11], 1, Concat, [1]]                       # 17: concat P3_fuse
  - [-1, 3, C2f, [256]]                              # 18: P3_out（stride=8）

  # Detect: P2 + P3 + P4（三尺度，stride=4/8/16）
  # - P2_out: idx=15 (160x160)
  # - P3_out: idx=18 (80x80)
  # - P4_out: idx=8  (40x40)  ← 直接复用 P4_lateral，最稳不改结构
  - [[15, 18, 8], 1, Detect, [nc]]                   # 19: 三尺度检测头

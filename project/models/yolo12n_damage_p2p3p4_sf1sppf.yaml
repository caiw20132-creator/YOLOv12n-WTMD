# YOLO Damage (P4-lite backbone) + SF1SPPF + Detect(P2,P3,P4)

nc: 1

depth_multiple: 0.33
width_multiple: 0.25
max_channels: 1024

backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0  /2
  - [-1, 1, Conv, [128, 3, 2]]         # 1  /4
  - [-1, 3, C2f, [128]]                # 2  P2 (/4)

  - [-1, 1, Conv, [256, 3, 2]]         # 3  /8
  - [-1, 6, C2f, [256]]                # 4  P3 (/8)

  - [-1, 1, Conv, [512, 3, 2]]         # 5  /16
  - [-1, 6, C2f, [512]]                # 6  P4 (/16)

  - [-1, 1, SF1SPPF, [128, 5]]         # 7  注意：128 = 512*0.25

head:
  # P4 -> P3
  - [-1, 1, Conv, [256, 1, 1]]                         # 8  P4 reduce
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 9
  - [[-1, 4], 1, Concat, [1]]                          # 10 concat P3
  - [-1, 3, C2f, [256]]                                # 11 P3_fuse

  # P3 -> P2
  - [-1, 1, Conv, [128, 1, 1]]                         # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 13
  - [[-1, 2], 1, Concat, [1]]                          # 14 concat P2
  - [-1, 3, C2f, [128]]                                # 15 P2_out

  # PAN: P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]                         # 16 down to /8
  - [[-1, 11], 1, Concat, [1]]                         # 17 concat P3_fuse
  - [-1, 3, C2f, [256]]                                # 18 P3_out

  # PAN: P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                         # 19 down to /16
  - [[-1, 8], 1, Concat, [1]]                           # 20 concat P4_reduce
  - [-1, 3, C2f, [256]]                                # 21 P4_out

  - [[15, 18, 21], 1, Detect, [nc]]                    # 22 Detect(P2,P3,P4)
